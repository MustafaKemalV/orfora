<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>orfora // the grid</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="grid-floor"></div>
    <svg id="circuit" class="circuit" aria-hidden="true"></svg>
    <svg id="beams" class="beams" aria-hidden="true"></svg>

    <header class="masthead">
      <h1>ORFORA</h1>
      <p class="tagline">
        semantic model router // route each request to its best-fit model on the grid
      </p>
    </header>

    <section class="console">
      <textarea
        id="prompt"
        rows="2"
        placeholder="Enter a request. e.g. Refactor this module and explain the change."
      ></textarea>
      <button id="run" type="button">ROUTE</button>
      <div class="chips" id="chips"></div>
      <div class="status" id="status">
        STANDBY // no key, runs in your browser (the first run downloads a small model)
      </div>
    </section>

    <section class="hud" id="hud" hidden>
      <div class="hud-cell"><span>CAPABILITY</span><b id="hud-cap">-</b></div>
      <div class="hud-cell"><span>TIER</span><b id="hud-tier">-</b></div>
      <div class="hud-cell"><span>MODEL</span><b id="hud-model">-</b></div>
      <div class="hud-cell"><span>FITNESS</span><b id="hud-fit">-</b></div>
      <div class="hud-cell"><span>COST</span><b id="hud-cost">-</b></div>
      <div class="hud-cell wide"><span>REASON</span><b id="hud-reason">-</b></div>
    </section>

    <section class="board" id="board" aria-label="model grid"></section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
